name: funadata
on:
  schedule:
    # データ攻めは毎朝5時すぎに今日の見どころ・荒れスコアを作るので、そのあと（5:45）に読む。8:15 は読み直し（間に合わなかった日のため）
    - cron: "45 20 * * *"
    - cron: "15 23 * * *"
  workflow_dispatch:
    inputs:
      export:
        description: "all = 全部のデータを書き出す / daily = 毎日のものだけ"
        default: "all"
permissions:
  contents: write
concurrency:
  group: funadata
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get repository
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: repo/funacache
          key: funacache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: funacache-
      - name: Import data-seme site
        working-directory: repo
        env:
          FUNA_EXPORT: ${{ github.event.inputs.export || 'daily' }}
        run: node funanote.mjs
      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: repo/funacache
          key: funacache-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save data
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add funanote-manifest.json funadata
          git diff --cached --quiet || git commit -m "Update funadata"
          git push || (git pull --rebase && git push)
