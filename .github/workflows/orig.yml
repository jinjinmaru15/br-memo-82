name: orig-test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Get repository
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: repo/origcache
          key: origcache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: origcache-
      - name: Test Mikuni original exhibition data
        working-directory: repo
        run: node orig.mjs
      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: repo/origcache
          key: origcache-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save result
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orig.json
          git diff --cached --quiet || git commit -m "Update orig test"
          git push || (git pull --rebase && git push)
