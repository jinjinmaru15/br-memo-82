name: record
on:
  schedule:
    - cron: "50 22,6,14 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: record
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get repository
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
      - name: Restore odds log
        uses: actions/cache/restore@v4
        with:
          path: repo/oddslog
          key: oddslog-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: oddslog-
      - name: Record paper trades
        working-directory: repo
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node record.mjs
      - name: Save odds log
        uses: actions/cache/save@v4
        with:
          path: repo/oddslog
          key: oddslog-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper.json
          git diff --cached --quiet || git commit -m "Update paper trades"
          git push || (git pull --rebase && git push)
