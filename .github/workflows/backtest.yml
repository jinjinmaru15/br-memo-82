name: backtest
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get repository
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: repo/btcache
          key: btcache-${{ github.run_id }}
          restore-keys: btcache-
      - name: Run backtest
        working-directory: repo
        run: node backtest.mjs
      - name: Save
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest.json
          git diff --cached --quiet || git commit -m "Update backtest"
          git push || (git pull --rebase && git push)
