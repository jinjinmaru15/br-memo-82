name: funanote
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get repository
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: repo/funacache
          key: funacache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: funacache-
      - name: Import data-seme site
        working-directory: repo
        run: node funanote.mjs
      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: repo/funacache
          key: funacache-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save manifest
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add funanote-manifest.json
          git diff --cached --quiet || git commit -m "Update funanote manifest"
          git push || (git pull --rebase && git push)
